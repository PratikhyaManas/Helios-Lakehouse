# yaml-language-server: $schema=https://raw.githubusercontent.com/databricks/cli/main/bundle/internal/schema/jsonschema.json
# Helios Retail Group — lakehouse bundle
# Jobs, Lakeflow pipelines, and ML resources in one repo.

bundle:
  name: helios-lakehouse
  uuid: 7c3e9b12-4a81-4f0d-9e2a-1a2b3c4d5e6f
  databricks_cli_version: ">=0.250.0"

include:
  - resources/**/*.yml

artifacts:
  helios_lakehouse:
    type: whl
    path: .
    build: python -m pip wheel -w dist --no-deps .

sync:
  include:
    - src/**
    - resources/**
    - pyproject.toml
  exclude:
    - tests/**
    - "**/*.pyc"
    - .venv/**
    - dist/**
    - "**/.DS_Store"

variables:
  catalog:
    description: Unity Catalog for this target
  bronze_schema:
    description: Bronze schema
    default: bronze
  silver_schema:
    description: Silver schema
    default: silver
  gold_schema:
    description: Gold schema
    default: gold
  ml_schema:
    description: Features, models, inference schema
    default: ml
  ops_schema:
    description: Volumes and operational tables
    default: ops
  landing_volume:
    description: Autoloader landing volume path
  warehouse_id:
    description: Serverless SQL warehouse for monitors
  service_principal_id:
    description: Application ID used as run_as in shared targets
  notification_email:
    description: Failure notifications
    default: platform-oncall@helios-retail.example
  schedule_pause_status:
    description: PAUSED in development, UNPAUSED otherwise
  git_sha:
    description: Commit stamped onto jobs at deploy
    default: local

permissions:
  - group_name: helios-platform-admins
    level: CAN_MANAGE
  - group_name: helios-data-engineers
    level: CAN_RUN
  - group_name: helios-data-scientists
    level: CAN_VIEW

workspace:
  file_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}

targets:
  dev:
    mode: development
    default: true
    presets:
      name_prefix: "[dev ${workspace.current_user.short_name}] "
      pipelines_development: true
      trigger_pause_status: PAUSED
    workspace:
      host: https://adb-dev-helios.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: helios_dev
      landing_volume: /Volumes/helios_dev/ops/landing
      warehouse_id: REPLACE_ME_DEV_WAREHOUSE
      service_principal_id: "00000000-0000-0000-0000-000000000001"
      schedule_pause_status: PAUSED
    run_as:
      user_name: ${workspace.current_user.userName}

  staging:
    mode: production
    workspace:
      host: https://adb-staging-helios.azuredatabricks.net
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: helios_staging
      landing_volume: /Volumes/helios_staging/ops/landing
      warehouse_id: REPLACE_ME_STAGING_WAREHOUSE
      service_principal_id: "00000000-0000-0000-0000-000000000002"
      schedule_pause_status: UNPAUSED
    run_as:
      service_principal_name: ${var.service_principal_id}

  prod:
    mode: production
    workspace:
      host: https://adb-prod-helios.azuredatabricks.net
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: helios_prod
      landing_volume: /Volumes/helios_prod/ops/landing
      warehouse_id: REPLACE_ME_PROD_WAREHOUSE
      service_principal_id: "00000000-0000-0000-0000-000000000003"
      schedule_pause_status: UNPAUSED
      notification_email: data-platform-oncall@helios-retail.example
    run_as:
      service_principal_name: ${var.service_principal_id}
