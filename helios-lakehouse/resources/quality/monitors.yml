resources:
  quality_monitors:
    gold_sales_daily:
      table_name: ${var.catalog}.${var.gold_schema}.sales_daily
      output_schema_name: ${var.catalog}.${var.ml_schema}
      assets_dir: /Workspace/Shared/helios/${bundle.target}/monitoring/sales_daily
      warehouse_id: ${var.warehouse_id}
      snapshot: {}
      schedule:
        quartz_cron_expression: "0 0 10 * * ?"
        timezone_id: America/New_York
      notifications:
        on_failure:
          email_addresses:
            - ${var.notification_email}
    demand_inference:
      table_name: ${var.catalog}.${var.ml_schema}.demand_predictions
      output_schema_name: ${var.catalog}.${var.ml_schema}
      assets_dir: /Workspace/Shared/helios/${bundle.target}/monitoring/demand
      warehouse_id: ${var.warehouse_id}
      inference_log:
        granularities:
          - "1 day"
        timestamp_col: scored_at
        model_id_col: model_version
        prediction_col: predicted_units
        label_col: actual_units
        problem_type: PROBLEM_TYPE_REGRESSION
      schedule:
        quartz_cron_expression: "0 30 10 * * ?"
        timezone_id: America/New_York
